name: Build DuoDock Tweak DEB

on:
  push:
    paths:
      - 'DuoDockTweak/**'
      - '.github/workflows/build_duodock_deb.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Developer Tools
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install dependencies (ldid, dpkg)
        run: |
          brew install ldid dpkg

      - name: Build DuoDock Rootless DEB
        run: |
          cd DuoDockTweak
          sed -i '' 's/\r$//' build_deb.sh
          chmod +x build_deb.sh
          set -o pipefail
          ./build_deb.sh 2>&1 | tee build.log

      - name: Output Build Log to Summary
        if: always()
        run: |
          echo "## DuoDock Build Log" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat DuoDockTweak/build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Push failure log to branch
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B debug-duodock-log
          git add -f DuoDockTweak/build.log
          git commit -m "DuoDock Build failure log [skip ci]" || true
          git push -f origin debug-duodock-log || true

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duodock-build-log
          path: DuoDockTweak/build.log

      - name: Upload DuoDock DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuoDock-rootless-deb
          path: "DuoDock_rootless.deb"
          if-no-files-found: error

      - name: Create or Update GitHub Release with DEB
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: duodock-latest
          name: "DuoDock v1.7.4 Rootless DEB (Fix Safe Mode iPhone 7 Plus)"
          body: |
            ### DuoDock v1.7.4 (Rootless iOS 15.0 - 15.8.x - iPhone 7 Plus Compatible)
            - **Khắc phục triệt để lỗi Safe Mode trên iPhone 7 Plus & Chip A10**:
              + **Sửa lỗi nhận diện FloatingDockXVI**: Sử dụng class method `+[SBFloatingDockController isFloatingDockSupported]` chuẩn xác (thay vì gọi `sharedInstance` vốn trả về `nil` làm sai lệch trạng thái dock).
              + **Bảo vệ toàn vẹn bố cục SpringBoard của iPhone 7 Plus**: Loại bỏ hoàn toàn các hook nguy hiểm trên `SBIconListGridLayoutConfiguration` (`iconImageInfo`, `numberOfPortraitRows`, `portraitLayoutInsets`) và `SBRootFolderView _frameForIconListViewAtIndex:`. Các hook này trước đây gây xung đột ABI struct ARM64 và vượt quá giới hạn grid màn hình 16:9 của iPhone 7 Plus, dẫn đến crash trực tiếp vào Safe Mode.
              + **Đồng bộ hóa an toàn `_frameForDockView`**: Giữ nguyên tính toán khung của hệ điều hành, đảm bảo các chấm trang (`pageControl`) và lưới icon ở độ phân giải 414x736 luôn ổn định tuyệt đối.
              + **Tối ưu hóa Dual-Mode Dock**: Vận hành trơn tru cả khi có FloatingDockXVI hoặc khi tắt FloatingDock để dùng Dock gốc độc lập.
            - **Tính năng Đặt lại mặc định (Reset to Defaults)**: Khôi phục toàn bộ cài đặt gốc tức thì với hộp thoại xác nhận trong Cài đặt.
            - **Tùy chỉnh số lượng icon trên Dock**: Chọn từ 2 đến 8 icon, tự động co dãn khoảng cách (Auto slot scale) chống đè icon.
            - **Tùy chọn Chế độ Dock (Dock Mode)**: Tự động (Khuyên dùng) / Dock gốc độc lập / FloatingDock.
            - **Tùy biến thanh Dock chuyên sâu**:
              + Tùy chọn vị trí bám mép màn hình: **Cạnh Trái** hoặc **Cạnh Phải**.
              + 4 phong cách nền kính: **Kính Tối**, **Kính Sáng**, **Siêu Mỏng**, **Trong Suốt**.
              + Đổ bóng nổi khối 3D với vector `shadowPath` mượt mà không tụt FPS.
              + Viền sáng viên thuốc với thanh trượt chỉnh độ dày viền (`borderWidth`).
              + Tùy chọn ẩn nhãn tên ứng dụng trên Dock.
              + Kéo thả trực tiếp và chụm 2 ngón tay phóng to/thu nhỏ icon (Pinch-to-scale) ngay trên màn hình chính (có giới hạn biên màn hình cho iPhone 7 Plus).
            - **Bố trí lưới màn hình chính an toàn**:
              + Chống đè icon màn hình chính (lưới icon tự động lùi lề tương ứng theo vị trí Dock trái/phải).
            - Tương thích Dopamine, Sileo, Zebra, kiến trúc `iphoneos-arm64`.
          files: "DuoDock_rootless.deb"

