name: Build DuoDock Tweak DEB

on:
  push:
    paths:
      - 'DuoDockTweak/**'
      - '.github/workflows/build_duodock_deb.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Developer Tools
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install dependencies (ldid, dpkg)
        run: |
          brew install ldid dpkg

      - name: Build DuoDock Rootless DEB
        run: |
          cd DuoDockTweak
          sed -i '' 's/\r$//' build_deb.sh
          chmod +x build_deb.sh
          set -o pipefail
          ./build_deb.sh 2>&1 | tee build.log

      - name: Output Build Log to Summary
        if: always()
        run: |
          echo "## DuoDock Build Log" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat DuoDockTweak/build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Push failure log to branch
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B debug-duodock-log
          git add -f DuoDockTweak/build.log
          git commit -m "DuoDock Build failure log [skip ci]" || true
          git push -f origin debug-duodock-log || true

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duodock-build-log
          path: DuoDockTweak/build.log

      - name: Upload DuoDock DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuoDock-rootless-deb
          path: "DuoDock_rootless.deb"
          if-no-files-found: error

      - name: Create or Update GitHub Release with DEB
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: duodock-latest
          name: "DuoDock v1.0.2 Rootless DEB (Fix Touch Freeze & Full Native Paging)"
          body: |
            ### DuoDock v1.0.2 (Rootless iOS 15.0 - 15.8.x - iPhone 7 Plus & A10 Compatible)
            - **Khắc phục triệt để lỗi đơ cảm ứng màn hình chính (Fix Touch Freeze)**:
              + **Nguyên nhân**: Việc swizzle `hitTest:withEvent:` trên `SBDockView` và `SBFloatingDockView` đã làm tráo đổi nhầm implementation `hitTest:` của lớp cha `UIView` trong toàn bộ tiến trình SpringBoard, khiến tất cả các view trên màn hình chính trả về `nil` khi nhận cảm ứng (chỉ có AssistiveTouch ở tiến trình riêng biệt còn di chuyển được).
              + **Xử lý**: Loại bỏ hoàn toàn tất cả các hook trên `hitTest:withEvent:`. Kích thước `SBDockView` được định dạng chính xác 74x320pt, toàn bộ không gian còn lại trên màn hình tự động chuyển tiếp cảm ứng mượt mà 100% đến trang cuộn icon và hình nền theo cơ chế mặc định của UIKit.
              + Cải tiến `SafeSwizzle` chuẩn xác để bảo vệ toàn vẹn các class cha của hệ thống (`UIView`), tuyệt đối không làm ô nhiễm bảng method toàn cục.
            - **Bảo lưu đầy đủ các tính năng tinh chỉnh sâu Dock gốc (`SBDockView`)**:
              + Tùy chọn vị trí Dock: Cạnh Trái hoặc Cạnh Phải (lưới icon tự động lùi lề tương ứng).
              + Tùy chỉnh số lượng icon trên Dock (2 đến 8 icon) với cơ chế Auto slot scale.
              + 4 phong cách nền kính mờ: Kính Tối, Kính Sáng, Siêu Mỏng, Trong Suốt cùng thanh trượt độ mờ.
              + Đổ bóng nổi khối 3D với vector `shadowPath` GPU mượt mà 120Hz.
              + Viền sáng viên thuốc với thanh trượt chỉnh độ dày viền.
              + Ẩn nhãn tên ứng dụng trên Dock.
              + Nút Khởi động lại SpringBoard (Respring) và Khôi phục cài đặt mặc định hoạt động ngay trong Cài đặt.
            - Tương thích Dopamine, Sileo, Zebra, kiến trúc `iphoneos-arm64`.
          files: "DuoDock_rootless.deb"

