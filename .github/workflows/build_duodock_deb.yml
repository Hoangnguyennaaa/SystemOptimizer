name: Build DuoDock Tweak DEB

on:
  push:
    paths:
      - 'DuoDockTweak/**'
      - '.github/workflows/build_duodock_deb.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Developer Tools
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install dependencies (ldid, dpkg)
        run: |
          brew install ldid dpkg

      - name: Build DuoDock Rootless DEB
        run: |
          cd DuoDockTweak
          sed -i '' 's/\r$//' build_deb.sh
          chmod +x build_deb.sh
          set -o pipefail
          ./build_deb.sh 2>&1 | tee build.log

      - name: Output Build Log to Summary
        if: always()
        run: |
          echo "## DuoDock Build Log" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat DuoDockTweak/build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Push failure log to branch
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B debug-duodock-log
          git add -f DuoDockTweak/build.log
          git commit -m "DuoDock Build failure log [skip ci]" || true
          git push -f origin debug-duodock-log || true

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duodock-build-log
          path: DuoDockTweak/build.log

      - name: Upload DuoDock DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuoDock-rootless-deb
          path: "DuoDock_rootless.deb"
          if-no-files-found: error

      - name: Create or Update GitHub Release with DEB
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: duodock-latest
          name: "DuoDock v1.7.0 Rootless DEB"
          body: |
            ### DuoDock v1.7.0 (Rootless iOS 15.0 - 15.8.x)
            - **Vô hiệu hóa triệt để FloatingDockXVI**: Loại bỏ hoàn toàn hiện tượng giật lag, đơ màn hình chính khi vuốt trang do xung đột gesture và layout engine.
            - **Tối ưu 100% Native 120Hz mượt mà**: Chuyển đổi và vận hành hoàn toàn trên thanh Dock gốc (`SBDockView`), giữ nguyên tốc độ phản hồi ProMotion.
            - **Tùy biến thanh Dock chuyên sâu**:
              + Tùy chọn vị trí bám mép màn hình: **Cạnh Trái** hoặc **Cạnh Phải**.
              + 4 phong cách nền kính: **Kính Tối**, **Kính Sáng**, **Siêu Mỏng**, **Trong Suốt**.
              + Đổ bóng nổi khối 3D (`shadowRadius`, `shadowOpacity`, `shadowOffset`).
              + Viền sáng viên thuốc với thanh trượt chỉnh độ dày viền (`borderWidth`).
              + Tùy chọn ẩn nhãn tên ứng dụng trên Dock.
              + Kéo thả trực tiếp và chụm 2 ngón tay phóng to/thu nhỏ icon (Pinch-to-scale) ngay trên màn hình chính.
            - **Bố trí lưới màn hình chính nâng cao**:
              + Chống đè icon màn hình chính (lưới icon tự động lùi lề tương ứng theo vị trí Dock trái/phải).
              + Tràn icon xuống đáy: Giải phóng 90pt diện tích đáy của Dock cũ để icon và widget tràn xuống sát viền.
              + Tự do tùy chỉnh số hàng (4 - 8 hàng) và số cột (3 - 5 cột) icon trên màn hình chính.
            - Tương thích Dopamine, Sileo, Zebra, kiến trúc `iphoneos-arm64`.
          files: "DuoDock_rootless.deb"

