name: Build DuoDock Tweak DEB

on:
  push:
    paths:
      - 'DuoDockTweak/**'
      - '.github/workflows/build_duodock_deb.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Developer Tools
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install dependencies (ldid, dpkg)
        run: |
          brew install ldid dpkg

      - name: Build DuoDock Rootless DEB
        run: |
          cd DuoDockTweak
          sed -i '' 's/\r$//' build_deb.sh
          chmod +x build_deb.sh
          set -o pipefail
          ./build_deb.sh 2>&1 | tee build.log

      - name: Output Build Log to Summary
        if: always()
        run: |
          echo "## DuoDock Build Log" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat DuoDockTweak/build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Push failure log to branch
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B debug-duodock-log
          git add -f DuoDockTweak/build.log
          git commit -m "DuoDock Build failure log [skip ci]" || true
          git push -f origin debug-duodock-log || true

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duodock-build-log
          path: DuoDockTweak/build.log

      - name: Upload DuoDock DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuoDock-rootless-deb
          path: "DuoDock_rootless.deb"
          if-no-files-found: error

      - name: Create or Update GitHub Release with DEB
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: duodock-latest
          name: "DuoDock v1.0.4 Rootless DEB (Smart Top/Bottom Spotlight Placement)"
          body: |
            ### DuoDock v1.0.4 (Rootless iOS 15.0 - 15.8.x - iPhone 7 Plus & A10 Compatible)
            - **Vị trí nút tìm kiếm Spotlight linh hoạt Trên / Dưới Dock (Smart Dynamic Placement)**:
              + Chế độ **Tự động (Auto)**: Khi Dock được kéo sát cạnh đáy màn hình (không gian phía dưới không đủ), nút tìm kiếm Spotlight sẽ tự động đảo vị trí lên **TRÊN đỉnh Dock**, cách ly an toàn và không bị che khuất hay đè lên Dock.
              + Tùy chọn vị trí cố định theo ý thích trong Cài đặt: **Tự động** (Auto) / **Luôn ở Dưới Dock** / **Luôn ở Trên Dock**.
              + Khoảng cách an toàn Status Bar & Dock: Luôn giữ khoảng cách chuẩn, không che tai thỏ / status bar ở trên và không đè vào icon thanh Dock.
            - **Bảo lưu trọn vẹn các tính năng cao cấp**:
              + Nút tìm kiếm tròn kính mờ (`UIVisualEffectView`) mở nhanh Spotlight với nhún lò xo và rung haptic.
              + Độc lập cảm ứng 100%, không lag, không đơ cảm ứng màn hình chính.
              + Tương thích tối ưu cho iPhone 7 Plus & chip A10 (iOS 15 Rootless Dopamine).
          files: "DuoDock_rootless.deb"

