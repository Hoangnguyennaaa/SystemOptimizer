name: Build DuoDock Tweak DEB

on:
  push:
    paths:
      - 'DuoDockTweak/**'
      - '.github/workflows/build_duodock_deb.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Developer Tools
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install dependencies (ldid, dpkg)
        run: |
          brew install ldid dpkg

      - name: Build DuoDock Rootless DEB
        run: |
          cd DuoDockTweak
          sed -i '' 's/\r$//' build_deb.sh
          chmod +x build_deb.sh
          set -o pipefail
          ./build_deb.sh 2>&1 | tee build.log

      - name: Output Build Log to Summary
        if: always()
        run: |
          echo "## DuoDock Build Log" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat DuoDockTweak/build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Push failure log to branch
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B debug-duodock-log
          git add -f DuoDockTweak/build.log
          git commit -m "DuoDock Build failure log [skip ci]" || true
          git push -f origin debug-duodock-log || true

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duodock-build-log
          path: DuoDockTweak/build.log

      - name: Upload DuoDock DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuoDock-rootless-deb
          path: "DuoDock_rootless.deb"
          if-no-files-found: error

      - name: Create or Update GitHub Release with DEB
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: duodock-latest
          name: "DuoDock v1.5.0 Rootless DEB"
          body: |
            ### DuoDock v1.5.0 (Rootless iOS 15.0 - 15.8.x)
            - Chuyển đổi Dock thành thanh Dock dọc dạng viên thuốc bên cạnh phải màn hình (iPhone Foldable / Duo style).
            - Chống đè icon màn hình chính: Tự động thu hẹp lề phải của lưới icon để nhường chỗ cho Dock.
            - Tràn icon xuống đáy (Dock cũ): Giải phóng 90pt diện tích đáy, cho phép icon tràn xuống hết cỡ và thêm hàng icon mới.
            - Kéo thả trực tiếp & phóng to thu nhỏ icon (Pinch-to-scale) ngay trên màn hình chính.
            - Tích hợp PreferenceBundle trong Cài đặt với nút Respring nhanh.
            - Tương thích Dopamine, Sileo, Zebra, arm64/arm64e.
          files: "DuoDock_rootless.deb"

