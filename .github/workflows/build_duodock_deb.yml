name: Build DuoDock Tweak DEB

on:
  push:
    paths:
      - 'DuoDockTweak/**'
      - '.github/workflows/build_duodock_deb.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Developer Tools
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install dependencies (ldid, dpkg)
        run: |
          brew install ldid dpkg

      - name: Build DuoDock Rootless DEB
        run: |
          cd DuoDockTweak
          sed -i '' 's/\r$//' build_deb.sh
          chmod +x build_deb.sh
          set -o pipefail
          ./build_deb.sh 2>&1 | tee build.log

      - name: Output Build Log to Summary
        if: always()
        run: |
          echo "## DuoDock Build Log" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat DuoDockTweak/build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Push failure log to branch
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B debug-duodock-log
          git add -f DuoDockTweak/build.log
          git commit -m "DuoDock Build failure log [skip ci]" || true
          git push -f origin debug-duodock-log || true

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duodock-build-log
          path: DuoDockTweak/build.log

      - name: Upload DuoDock DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuoDock-rootless-deb
          path: "DuoDock_rootless.deb"
          if-no-files-found: error

      - name: Create or Update GitHub Release with DEB
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: duodock-latest
          name: "DuoDock v1.0.1 Rootless DEB (Fix Respring & Deep Native Dock)"
          body: |
            ### DuoDock v1.0.1 (Rootless iOS 15.0 - 15.8.x - iPhone 7 Plus & A10 Compatible)
            - **Sửa triệt để tính năng Respring trong Cài đặt (Preferences.app)**:
              + Bổ sung Filter `com.apple.Preferences` vào `DuoDock.plist` để hook trực tiếp action `respringPrompt:`, `respring:`, `resetToDefaults:` vào `PSListController`.
              + Khi nhấn Respring trong Cài đặt, hộp thoại xác nhận lập tức xuất hiện và gửi Darwin Notification `com.hoangnguyen.duodock/respring` để SpringBoard tự reload ngay lập tức mà không bị sandbox chặn.
            - **Bổ sung tính năng tinh chỉnh sâu thanh Dock gốc (`SBDockView`)**:
              + **Vị trí bám mép màn hình**: Tùy chọn **Cạnh Trái** hoặc **Cạnh Phải**. Lưới icon màn hình chính tự động lùi lề tương ứng để chống đè dock.
              + **Tùy chỉnh số lượng icon trên Dock**: Chọn từ 2 đến 8 icon, tự động co dãn khoảng cách (Auto slot scale) chống đè và chống tràn icon.
              + **Phong cách nền kính Dock**: 4 kiểu nền kính mờ cao cấp (**Kính Tối**, **Kính Sáng**, **Siêu Mỏng**, **Trong Suốt**) cùng thanh trượt chỉnh độ mờ (`dockBlurAlpha`).
              + **Đổ bóng 3D nổi khối**: Tối ưu vector `shadowPath` cho GPU render trực tiếp, mượt mà 120Hz.
              + **Viền sáng viên thuốc**: Tùy chỉnh bật/tắt và độ dày viền (`borderWidth`).
              + **Ẩn nhãn tên ứng dụng trên Dock**: Giúp thanh Dock dọc tối giản, gọn gàng.
              + **Kích thước & Bo góc viên thuốc**: Chiều rộng, chiều cao, lề mép, vị trí dọc, độ bo góc capsule.
              + **Vô hiệu hóa an toàn FloatingDockXVI**: Tự động ẩn FloatingDockXVI khi DuoDock hoạt động để ưu tiên hoàn toàn Dock gốc độc lập, chống xung đột 2 dock đè lên nhau.
            - Tương thích Dopamine, Sileo, Zebra, kiến trúc `iphoneos-arm64`.
          files: "DuoDock_rootless.deb"

