name: Build DuoDock Tweak DEB

on:
  push:
    paths:
      - 'DuoDockTweak/**'
      - '.github/workflows/build_duodock_deb.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Developer Tools
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install dependencies (ldid, dpkg)
        run: |
          brew install ldid dpkg

      - name: Build DuoDock Rootless DEB
        run: |
          cd DuoDockTweak
          sed -i '' 's/\r$//' build_deb.sh
          chmod +x build_deb.sh
          set -o pipefail
          ./build_deb.sh 2>&1 | tee build.log

      - name: Output Build Log to Summary
        if: always()
        run: |
          echo "## DuoDock Build Log" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat DuoDockTweak/build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Push failure log to branch
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B debug-duodock-log
          git add -f DuoDockTweak/build.log
          git commit -m "DuoDock Build failure log [skip ci]" || true
          git push -f origin debug-duodock-log || true

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duodock-build-log
          path: DuoDockTweak/build.log

      - name: Upload DuoDock DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuoDock-rootless-deb
          path: "DuoDock_rootless.deb"
          if-no-files-found: error

      - name: Create or Update GitHub Release with DEB
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: duodock-latest
          name: "DuoDock v1.0.0 Rootless DEB (Fix Blank Settings)"
          body: |
            ### DuoDock v1.0.0 (Rootless iOS 15.0 - 15.8.x - iPhone 7 Plus & A10 Compatible)
            - **Khôi phục hoàn toàn nền tảng v1.0.0 nguyên bản**:
              + Tối giản, ổn định tuyệt đối, chạy mượt mà trên iPhone 7 Plus và chip A10 (iOS 15).
              + Không chứa các hook can thiệp lưới icon nguy hiểm, triệt tiêu hoàn toàn nguy cơ Safe Mode.
              + Thanh Dock dọc dạng viên thuốc bám cạnh phải màn hình với bo góc hoàn hảo và nền mờ tự nhiên.
              + Tự động chống đè icon màn hình chính (`SBIconListView` lùi lề an toàn).
            - **Khắc phục triệt để lỗi không hiển thị gì trong Cài đặt (Fix Blank Settings)**:
              + Nhúng trực tiếp danh sách specifier vào `PreferenceLoader/Preferences/DuoDock.plist`.
              + Tải cài đặt gốc trực tiếp qua Apple `PSListController` hệ thống, hiển thị 100% đầy đủ không còn hiện tượng trang trắng.
              + Tùy chỉnh đầy đủ: Bật/tắt, Số lượng icon (3-8), Tỷ lệ icon, Chiều rộng, Chiều cao, Lề phải, Vị trí dọc, Độ bo góc, Nền mờ/Độ mờ, Mở rộng icon xuống đáy.
              + Bổ sung nút Khởi động lại SpringBoard (Respring) và Khôi phục cài đặt mặc định ngay trong Cài đặt.
            - Tương thích Dopamine, Sileo, Zebra, kiến trúc `iphoneos-arm64`.
          files: "DuoDock_rootless.deb"

