name: Build CompactStatusBar IPA

on:
  push:
    paths:
      - 'CompactStatusBar/**'
      - '.github/workflows/build_compact_statusbar.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Developer Tools
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install dependencies (ldid)
        run: |
          brew install ldid

      - name: Build CompactStatusBar IPA
        run: |
          cd CompactStatusBar
          sed -i '' 's/\r$//' build_ipa.sh
          chmod +x build_ipa.sh
          bash -x build_ipa.sh 2>&1 | tee build.log

      - name: Publish Summary Log
        if: always()
        run: |
          echo "### Build Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 100 CompactStatusBar/build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload CompactStatusBar IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CompactStatusBar-ipa
          path: CompactStatusBar/CompactStatusBar.ipa
