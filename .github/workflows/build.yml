name: Build SystemOptimizer IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (ldid)
        run: |
          brew install ldid

      - name: Build IPA
        run: |
          sed -i '' 's/\r$//' build.sh
          chmod +x build.sh
          bash build.sh

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SystemOptimizer-ipa
          path: SystemOptimizer.ipa

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: SystemOptimizer.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
