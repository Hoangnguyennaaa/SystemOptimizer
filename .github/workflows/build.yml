name: Build SystemOptimizer IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Developer Tools
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install dependencies (ldid)
        run: |
          brew install ldid

      - name: Build IPA
        id: build_step
        run: |
          sed -i '' 's/\r$//' build.sh
          chmod +x build.sh
          bash -x build.sh 2>&1 | tee build.log

      - name: Publish Summary Log
        if: always()
        run: |
          echo "### Build Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 100 build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SystemOptimizer-ipa
          path: SystemOptimizer.ipa
