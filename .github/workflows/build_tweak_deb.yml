name: Build CompactStatusBar Tweak DEB

on:
  push:
    paths:
      - 'CompactStatusBarTweak/**'
      - '.github/workflows/build_tweak_deb.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Developer Tools
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install dependencies (ldid)
        run: |
          brew install ldid

      - name: Build DEB Package
        id: build_deb
        run: |
          cd CompactStatusBarTweak
          sed -i '' 's/\r$//' build_deb.sh
          chmod +x build_deb.sh
          bash -x build_deb.sh 2>&1 | tee build.log

      - name: Publish Summary Log
        if: always()
        run: |
          echo "### Build Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 100 CompactStatusBarTweak/build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Tweak DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CompactStatusBar-rootless-deb
          path: CompactStatusBarTweak/CompactStatusBar_rootless.deb
