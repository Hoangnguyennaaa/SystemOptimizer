name: Build CompactStatusBar Tweak DEB

on:
  push:
    paths:
      - 'CompactStatusBarTweak/**'
      - '.github/workflows/build_tweak_deb.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Developer Tools
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install dependencies (ldid, dpkg)
        run: |
          brew install ldid dpkg

      - name: Build DEB Package
        run: |
          cd CompactStatusBarTweak
          sed -i '' 's/\r$//' build_deb.sh
          chmod +x build_deb.sh
          set -o pipefail
          ./build_deb.sh 2>&1 | tee build.log

      - name: Output Log to Step Summary
        if: always()
        run: |
          echo "## Build Log" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat CompactStatusBarTweak/build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: CompactStatusBarTweak/build.log

      - name: Push failure log to branch
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B debug-build-log
          git add -f CompactStatusBarTweak/build.log
          git commit -m "Build failure log [skip ci]" || true
          git push -f origin debug-build-log || true

      - name: Upload Tweak DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CompactStatusBar-rootless-deb
          path: "**/*.deb"
          if-no-files-found: error
